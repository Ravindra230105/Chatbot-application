apiVersion: v1
kind: Namespace
metadata:
  name: ollive
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ollive
data:
  NODE_ENV: production
  PORT: '5000'
  DB_HOST: mysql
  DB_PORT: '3306'
  DB_NAME: ollive_inference
  DB_USER: root
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  INGESTION_URL: http://127.0.0.1:5000
  DEFAULT_PROVIDER: groq
  DEFAULT_MODEL: llama-3.3-70b-versatile
  GROQ_MODELS: llama-3.3-70b-versatile,llama-3.1-8b-instant,openai/gpt-oss-20b
  GEMINI_MODELS: gemini-3.1-flash-lite,gemini-3.5-flash,gemini-3.6-flash
  MAX_OUTPUT_TOKENS: '1024'
  GEMINI_MAX_OUTPUT_TOKENS: '3072'
  GEMINI_THINKING_LEVEL: low
  CONTEXT_MESSAGE_LIMIT: '10'
  REDACT_PII: 'true'
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ollive
type: Opaque
stringData:
  DB_PASSWORD: change-me
  INGESTION_API_KEY: change-me
  GROQ_API_KEY: ''
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  GEMINI_API_KEY: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: ollive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ollive
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: ollive_inference
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ollive
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ollive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ollive
spec:
  selector:
    app: redis
  ports:
    - port: 6379
